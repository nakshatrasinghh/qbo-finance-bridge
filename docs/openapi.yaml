    Unauthorized:
      description: The QuickBooks connection is inactive or authentication failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: QuickBooks denied access.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: The local connection or QuickBooks resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: Request parameters or create input were invalid, or QuickBooks rejected the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: The idempotency key was reused with different input, its earlier outcome cannot be safely replayed, or QuickBooks reported a conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: QuickBooks rate limit was reached.
      content:
