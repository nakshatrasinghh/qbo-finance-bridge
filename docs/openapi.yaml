          type: string
          enum: [section, data, summary]
        group:
          type: string
          nullable: true
          description: QuickBooks report group identifier when supplied.
        depth:
          type: integer
          minimum: 0
          description: Nesting depth from the original recursive QuickBooks report structure.
        cells:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/FinancialReportCell'
