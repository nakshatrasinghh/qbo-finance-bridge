components:
  parameters:
    ConnectionId:
      name: connection_id
      in: path
      required: true
      description: Local database ID of the encrypted QuickBooks connection.
      schema:
        type: integer
        format: int64
        minimum: 1
    TxnDateFrom:
      name: txn_date_from
      in: query
      required: false
      description: Inclusive lower bound for the Journal Entry transaction date, in ISO 8601 `YYYY-MM-DD` form.
      schema:
        type: string
        format: date
    ReportStartDate:
      name: start_date
      in: query
      required: false
      description: |
        Inclusive report-period start in exact ISO 8601 `YYYY-MM-DD` form. Defaults to six calendar months
        before `end_date`.
      schema:
        type: string
        format: date
    ReportEndDate:
      name: end_date
      in: query
      required: false
      description: |
        Inclusive report-period end in exact ISO 8601 `YYYY-MM-DD` form. Defaults to the current Rails date, must
        be after `start_date`, and must be no more than six calendar months later.
      schema:
        type: string
        format: date
    ReportAsOfDate:
      name: as_of_date
      in: query
      required: false
      description: Balance Sheet date in exact ISO 8601 `YYYY-MM-DD` form. Defaults to the current Rails date.
      schema:
        type: string
        format: date
    AccountingMethod:
      name: accounting_method
      in: query
      required: false
      description: Accounting basis for all supported reports except Cash Flow. Defaults to Accrual.
      schema:
        type: string
        enum: [Cash, Accrual]
        default: Accrual
    TxnDateTo:
      name: txn_date_to
      in: query
      required: false
      description: Inclusive upper bound for the Journal Entry transaction date, in ISO 8601 `YYYY-MM-DD` form.
      schema:
        type: string
        format: date
    Page:
      name: page
      in: query
      required: false
      description: One-based page number in the deterministic filtered result order.
      schema:
        type: integer
        minimum: 1
        maximum: 10000
        default: 1
    PerPage:
      name: per_page
      in: query
      required: false
      description: Maximum records returned in one page. One extra record is read internally only to set `has_more`.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 50
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        A caller-generated UUID for one intended create operation. It is unique within the selected connection
        and is also sent to Intuit as requestid. Preserve the same key when the outcome is unknown; use a new key
        only for a deliberately new or corrected record.
      schema:
        type: string
        format: uuid
        maxLength: 50
  headers:
    IdempotencyReplayed:
      description: Always `true` for a replayed response.
      schema:
        type: string
        enum: ['true']
    IdempotencyNotReplayed:
      description: Always `false` for a newly completed request.
      schema:
        type: string
        enum: ['false']
  securitySchemes:
    railsSession:
      type: apiKey
      in: cookie
      name: _qbo_finance_bridge_session
      description: Browser-managed same-origin Rails session cookie.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Rails authenticity token required for POST requests.
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Account:
      type: object
      additionalProperties: false
      required: [id, name, display_name, account_type, account_subtype, classification]
      properties:
        id:
          type: string
          description: Realm-scoped QuickBooks Account ID.
        name:
          type: string
        display_name:
          type: string
        account_type:
          type: string
        account_subtype:
          type: string
          nullable: true
        classification:
          type: string
          nullable: true
    AccountsResponse:
      type: object
      additionalProperties: false
      required: [accounts]
      properties:
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/Account'
    Employee:
      type: object
      additionalProperties: false
      required: [id, display_name, given_name, family_name, email, phone, active]
      properties:
        id:
          type: string
          description: Connection-scoped QuickBooks Employee ID.
        display_name:
          type: string
        given_name:
          type: string
        family_name:
          type: string
        email:
          type: string
          nullable: true
          format: email
        phone:
          type: string
          nullable: true
        active:
          type: boolean
    EmployeesResponse:
      type: object
      additionalProperties: false
      required: [employees, capabilities]
      properties:
        employees:
          type: array
          items:
            $ref: '#/components/schemas/Employee'
        capabilities:
          type: object
          additionalProperties: false
          required: [employee_records, full_payroll]
          properties:
            employee_records:
              type: boolean
              enum: [true]
            full_payroll:
              type: boolean
              enum: [false]
    EmployeeResponse:
      type: object
      additionalProperties: false
      required: [employee, idempotency]
      properties:
        employee:
          $ref: '#/components/schemas/Employee'
        idempotency:
          $ref: '#/components/schemas/IdempotencyResult'
    CreateEmployeeRequest:
      type: object
      additionalProperties: false
      required: [employee]
      properties:
        employee:
          type: object
          additionalProperties: false
          required: [given_name, family_name]
          properties:
            given_name:
              type: string
              minLength: 1
              maxLength: 100
            family_name:
              type: string
              minLength: 1
              maxLength: 100
            email:
              type: string
              format: email
              maxLength: 100
            phone:
              type: string
              maxLength: 20
    TimeActivity:
      type: object
      additionalProperties: false
      required: [id, txn_date, employee_id, employee_name, hours, minutes, description]
      properties:
        id:
          type: string
          description: Connection-scoped QuickBooks TimeActivity ID.
        txn_date:
          type: string
          format: date
        employee_id:
          type: string
        employee_name:
          type: string
          nullable: true
        hours:
          type: integer
          minimum: 0
        minutes:
          type: integer
          minimum: 0
          maximum: 59
        description:
          type: string
          nullable: true
    TimeActivitiesResponse:
      type: object
      additionalProperties: false
      required: [time_activities]
      properties:
        time_activities:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/TimeActivity'
    TimeActivityResponse:
      type: object
      additionalProperties: false
      required: [time_activity, idempotency]
      properties:
        time_activity:
          $ref: '#/components/schemas/TimeActivity'
        idempotency:
          $ref: '#/components/schemas/IdempotencyResult'
    CreateTimeActivityRequest:
      type: object
      additionalProperties: false
      required: [time_activity]
      properties:
        time_activity:
          type: object
          additionalProperties: false
          required: [employee_id, txn_date, hours, minutes, description]
          properties:
            employee_id:
              type: string
            txn_date:
              type: string
              format: date
            hours:
              type: integer
              minimum: 0
              maximum: 8760
            minutes:
              type: integer
              minimum: 0
              maximum: 59
            description:
              type: string
              minLength: 1
              maxLength: 500
    TaxCode:
      type: object
      additionalProperties: false
      required: [id, name, description, taxable, active, sales_rate_ids, purchase_rate_ids]
      properties:
        id:
          type: string
          description: Connection-scoped QuickBooks TaxCode ID.
        name:
          type: string
        description:
          type: string
          nullable: true
        taxable:
          type: boolean
        active:
          type: boolean
        sales_rate_ids:
          type: array
          items:
            type: string
        purchase_rate_ids:
          type: array
          items:
            type: string
    TaxRate:
      type: object
      additionalProperties: false
      required: [id, name, description, rate_value, agency_id, agency_name, active]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        rate_value:
          type: string
          pattern: '^\d+(\.\d+)?$'
          description: Decimal percentage string; never a JSON floating-point number.
        agency_id:
          type: string
        agency_name:
          type: string
          nullable: true
        active:
          type: boolean
    TaxAgency:
      type: object
      additionalProperties: false
      required: [id, display_name, tracks_sales, tracks_purchases]
      properties:
        id:
          type: string
        display_name:
          type: string
        tracks_sales:
          type: boolean
          description: Whether this TaxAgency advertises tax tracking on sales.
        tracks_purchases:
          type: boolean
          description: Whether this TaxAgency advertises tax tracking on purchases.
    TaxCatalogResponse:
      type: object
      additionalProperties: false
      required: [tax_codes, tax_rates, tax_agencies]
      properties:
        tax_codes:
          type: array
          items:
            $ref: '#/components/schemas/TaxCode'
        tax_rates:
          type: array
          items:
            $ref: '#/components/schemas/TaxRate'
        tax_agencies:
          type: array
          items:
            $ref: '#/components/schemas/TaxAgency'
    TaxCodeResponse:
      type: object
      additionalProperties: false
      required: [tax_code, idempotency]
      properties:
        tax_code:
          $ref: '#/components/schemas/TaxCode'
        idempotency:
          $ref: '#/components/schemas/IdempotencyResult'
    CreateTaxCodeRequest:
      type: object
      additionalProperties: false
      required: [tax_code]
      properties:
        tax_code:
          type: object
          additionalProperties: false
          required: [name, tax_rate_id, applicable_on]
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 100
            tax_rate_id:
              type: string
              description: ID of an active TaxRate whose TaxAgency supports the requested applicability.
            applicable_on:
              type: string
              enum: [Sales, Purchase]
              description: Must match the selected TaxRate agency's advertised tracking capability.
    InventoryItem:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - sku
        - description
