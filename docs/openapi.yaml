        - basis
        - currency
        - generated_at
        - start_date
        - end_date
        - no_data
        - columns
        - rows
      properties:
        type:
          type: string
          enum: [profit_and_loss, balance_sheet, cash_flow, general_ledger, trial_balance]
        title:
          type: string
        basis:
          type: string
          nullable: true
          description: Cash or Accrual when supplied; null for Cash Flow because QuickBooks omits ReportBasis.
