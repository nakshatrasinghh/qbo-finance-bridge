openapi: 3.0.3
info:
  title: QuickBooks Finance Bridge API
  version: 1.5.2
  description: |
    JSON endpoints used by the local QuickBooks sandbox dashboard. Rails exposes twenty-nine same-origin finance
    JSON operations: five reports, Account and Journal Entry reads, local Journal Entry audit history, and
    controlled GET/POST pairs for Journal Entries, Employees, TimeActivities, TaxCodes, Inventory Items,
    Customers, Vendors, Invoices, Bills, Customer Payments, and Bill Payments. A separate read-only endpoint
    reports application liveness. Rails is the API boundary and calls the QuickBooks Online sandbox behind the
    accounting endpoints; Journal Entry audit history reads PostgreSQL only.

    This is a local sandbox API. Every POST creates a real QuickBooks sandbox record, requires a Rails session,
    CSRF token, and UUID Idempotency-Key, and is intentionally not executable from Swagger UI. Employee and
    TimeActivity are payroll-adjacent Accounting API capabilities; full payroll is not exposed.
servers:
  - url: /
    description: Current Rails application
tags:
  - name: System
    description: Application liveness.
  - name: Accounts
    description: Eligible active QuickBooks Accounts for Journal Entry lines.
  - name: Financial Reports
    description: Read-only statements calculated by QuickBooks from existing sandbox accounting data.
  - name: Journal Entries
    description: Balanced QuickBooks sandbox financial records.
  - name: Audit History
    description: Read-only local evidence of Journal Entry submission operations.
  - name: Workforce
    description: Payroll-adjacent Employee records and employee TimeActivities; not payroll processing.
  - name: Tax Configuration
    description: QuickBooks TaxCodes, TaxRates, and TaxAgencies with controlled TaxCode creation.
  - name: Inventory
    description: QuickBooks Inventory Items and eligible supporting Accounts.
  - name: Customers
    description: Active QuickBooks Customer list records.
  - name: Vendors
    description: Active QuickBooks Vendor list records.
  - name: Sales
    description: QuickBooks Invoices and customer Payments applied to open Invoices.
  - name: Payables
    description: QuickBooks Bills and check-style BillPayments applied to open Bills.
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check application liveness
      description: Returns a stable JSON response when the Rails application can serve requests.
      tags: [System]
      responses:
        '200':
          description: Rails is serving requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
  /api/v1/quickbooks/connections/{connection_id}/accounts:
    get:
      operationId: listEligibleAccounts
      summary: List eligible QuickBooks Accounts
      description: |
        Returns active Accounts that may be selected for the simple Journal Entry flow. Accounts Receivable
        and Accounts Payable are excluded.
      tags: [Accounts]
      parameters:
        - $ref: '#/components/parameters/ConnectionId'
      responses:
        '200':
          description: Eligible active Accounts, sorted by display name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountsResponse'
              example:
                accounts:
                  - id: '35'
                    name: Checking
                    display_name: Checking
                    account_type: Bank
                    account_subtype: Checking
                    classification: Asset
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
  /api/v1/quickbooks/connections/{connection_id}/reports/profit_and_loss:
    get:
      operationId: getProfitAndLoss
      summary: Get a QuickBooks Profit & Loss statement
      description: |
        Returns a normalized read-only Profit & Loss report for an inclusive period of at most six calendar
        months. QuickBooks calculates all values; Rails preserves ordered rows and decimal amount strings.
      tags: [Financial Reports]
      parameters:
        - $ref: '#/components/parameters/ConnectionId'
        - $ref: '#/components/parameters/ReportStartDate'
        - $ref: '#/components/parameters/ReportEndDate'
        - $ref: '#/components/parameters/AccountingMethod'
      responses:
        '200':
          description: QuickBooks Profit & Loss statement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialReportResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
  /api/v1/quickbooks/connections/{connection_id}/reports/balance_sheet:
    get:
      operationId: getBalanceSheet
      summary: Get a QuickBooks Balance Sheet
      description: |
        Returns a normalized read-only Balance Sheet as of one ISO 8601 date. Rails sends `as_of_date` to
        QuickBooks as the native report `end_date`; QuickBooks calculates all values.
      tags: [Financial Reports]
      parameters:
        - $ref: '#/components/parameters/ConnectionId'
        - $ref: '#/components/parameters/ReportAsOfDate'
        - $ref: '#/components/parameters/AccountingMethod'
      responses:
        '200':
          description: QuickBooks Balance Sheet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialReportResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
  /api/v1/quickbooks/connections/{connection_id}/reports/cash_flow:
    get:
      operationId: getCashFlow
      summary: Get a QuickBooks Cash Flow statement
      description: |
        Returns a normalized read-only Cash Flow statement for an inclusive period of at most six calendar
        months. The QuickBooks Cash Flow contract neither accepts `accounting_method` nor returns `ReportBasis`.
      tags: [Financial Reports]
      parameters:
        - $ref: '#/components/parameters/ConnectionId'
        - $ref: '#/components/parameters/ReportStartDate'
        - $ref: '#/components/parameters/ReportEndDate'
      responses:
        '200':
          description: QuickBooks Cash Flow statement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialReportResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
  /api/v1/quickbooks/connections/{connection_id}/journal_entries:
    get:
      operationId: listJournalEntries
      summary: List QuickBooks Journal Entries
      description: |
        Returns one bounded page of Journal Entries from the connected QuickBooks sandbox. Optional inclusive
        transaction-date filters are sent to QuickBooks. Results are ordered by transaction date and QuickBooks
        ID descending so STARTPOSITION pagination has a deterministic order.
      tags: [Journal Entries]
      parameters:
        - $ref: '#/components/parameters/ConnectionId'
        - $ref: '#/components/parameters/TxnDateFrom'
        - $ref: '#/components/parameters/TxnDateTo'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Journal Entries sorted newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalEntriesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
    post:
      operationId: createJournalEntry
      summary: Create one balanced QuickBooks Journal Entry
      description: |
        Reserves the connection-scoped Idempotency-Key in the local audit ledger, creates equal positive debit
        and credit lines with that UUID forwarded to Intuit as requestid, and reads the Journal Entry back from
        QuickBooks before returning HTTP 201. Repeating a completed key with identical canonical input returns
        the stored result with HTTP 200 and does not call QuickBooks. Reusing a key with different input, or a
        key whose earlier outcome is unresolved, returns HTTP 409 without a new QuickBooks POST. This operation
        creates a real sandbox transaction and is not enabled in Swagger UI.
      tags: [Journal Entries]
      parameters:
        - $ref: '#/components/parameters/ConnectionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      security:
        - railsSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJournalEntryRequest'
            example:
              journal_entry:
                txn_date: '2026-07-15'
                memo: Monthly accrual
                amount: '100.00'
                debit_account_id: '35'
                credit_account_id: '79'
      responses:
        '200':
          description: A previously completed identical request was replayed from the local audit ledger; QuickBooks was not called.
          headers:
            Idempotency-Replayed:
              description: Always `true` for a replayed response.
              schema:
                type: string
                enum: ['true']
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalEntryResponse'
        '201':
          description: Journal Entry created and verified by QuickBooks readback.
          headers:
            Idempotency-Replayed:
              description: Always `false` for a newly completed request.
              schema:
                type: string
                enum: ['false']
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalEntryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
  /api/v1/quickbooks/connections/{connection_id}/journal_entry_operations:
    get:
      operationId: listJournalEntryOperations
      summary: List local Journal Entry submission operations
      description: |
        Returns one bounded page of connection-scoped audit operations from PostgreSQL, newest submission first.
        Optional inclusive filters use the original Journal Entry transaction date. This endpoint does not call
        QuickBooks and does not expose idempotency keys, request digests, OAuth tokens, or raw vendor responses.
      tags: [Audit History]
      parameters:
        - $ref: '#/components/parameters/ConnectionId'
        - $ref: '#/components/parameters/TxnDateFrom'
        - $ref: '#/components/parameters/TxnDateTo'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Local Journal Entry operations sorted newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalEntryOperationsResponse'
              example:
                journal_entry_operations:
                  - id: 1
                    status: succeeded
                    txn_date: '2026-01-15'
                    memo: Quarter-end adjustment
                    amount: '25.00'
                    debit_account_id: '1001'
                    credit_account_id: '1002'
                    quickbooks_journal_entry_id: '12345'
                    error_code: null
                    created_at: '2026-01-15T15:18:00.000+05:30'
                    completed_at: '2026-01-15T15:18:00.000+05:30'
                pagination:
                  page: 1
                  per_page: 50
                  returned_count: 1
                  has_more: false
                  next_page: null
                filters:
                  txn_date_from: null
                  txn_date_to: null
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/v1/quickbooks/connections/{connection_id}/employees:
    get:
      operationId: listEmployees
      summary: List active QuickBooks Employees
      description: |
        Returns active public Accounting API Employee records. This is workforce directory data and does not
        expose compensation, SSN, payroll runs, paychecks, deductions, or tax filings.
      tags: [Workforce]
      parameters:
        - $ref: '#/components/parameters/ConnectionId'
      responses:
        '200':
          description: Active Employees sorted by display name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
    post:
      operationId: createEmployee
      summary: Create one limited QuickBooks Employee record
      description: |
        Creates names plus optional email/phone only, then reads the Employee back before success. A new request
        is audited locally and forwards the UUID to Intuit as requestid. A matching completed key is replayed
        locally; conflicting or unresolved reuse returns HTTP 409. This does not enroll or pay the Employee and
        is not executable from Swagger UI.
      tags: [Workforce]
      parameters:
        - $ref: '#/components/parameters/ConnectionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      security:
        - railsSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmployeeRequest'
      responses:
        '200':
          $ref: '#/components/responses/ReplayedEmployee'
        '201':
          description: Employee created and verified by QuickBooks readback.
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyNotReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
  /api/v1/quickbooks/connections/{connection_id}/time_activities:
    get:
      operationId: listEmployeeTimeActivities
      summary: List recent QuickBooks employee TimeActivities
      description: Returns up to 100 employee TimeActivities ordered by transaction date descending.
      tags: [Workforce]
      parameters:
        - $ref: '#/components/parameters/ConnectionId'
      responses:
        '200':
          description: Recent employee TimeActivities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeActivitiesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
    post:
      operationId: createEmployeeTimeActivity
      summary: Create one employee TimeActivity
      description: |
        Validates an active Employee, ISO work date, whole hours/minutes, and description; creates the
        TimeActivity and verifies it by readback. It records time only and does not calculate payroll or invoice
        a customer. The audited/idempotent sandbox write is not executable from Swagger UI.
      tags: [Workforce]
      parameters:
        - $ref: '#/components/parameters/ConnectionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      security:
        - railsSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTimeActivityRequest'
      responses:
        '200':
          $ref: '#/components/responses/ReplayedTimeActivity'
        '201':
          description: TimeActivity created and verified by QuickBooks readback.
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyNotReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeActivityResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
  /api/v1/quickbooks/connections/{connection_id}/tax_codes:
    get:
      operationId: listTaxConfiguration
      summary: List QuickBooks TaxCodes, TaxRates, and TaxAgencies
      description: Returns the sandbox tax configuration needed to review codes and select an existing rate.
      tags: [Tax Configuration]
      parameters:
        - $ref: '#/components/parameters/ConnectionId'
      responses:
        '200':
          description: TaxCode, TaxRate, and TaxAgency catalog.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxCatalogResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
    post:
      operationId: createTaxCode
      summary: Create one TaxCode from an existing TaxRate
      description: |
        Creates a unique TaxCode for Sales or Purchase using one existing active TaxRate through TaxService. The
        selected rate's current TaxAgency must advertise the matching sales or purchase tracking capability.
        Rails then queries the TaxCode back and verifies the returned rate list. It does not create a rate/agency,
        calculate transaction tax, file a return, or make a tax payment. The audited/idempotent sandbox write is
        not executable from Swagger UI.
      tags: [Tax Configuration]
      parameters:
        - $ref: '#/components/parameters/ConnectionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      security:
        - railsSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaxCodeRequest'
      responses:
        '200':
          $ref: '#/components/responses/ReplayedTaxCode'
        '201':
          description: TaxCode created and verified by QuickBooks readback.
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyNotReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxCodeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
  /api/v1/quickbooks/connections/{connection_id}/inventory_items:
    get:
      operationId: listInventoryItems
      summary: List Inventory Items and eligible Accounts
      description: |
        Returns QuickBooks Inventory Items plus eligible sales-income, cost-of-goods-sold, and inventory-asset
        Accounts required by the controlled create operation.
      tags: [Inventory]
      parameters:
        - $ref: '#/components/parameters/ConnectionId'
      responses:
        '200':
          description: Inventory Items and account choices.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryCatalogResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
    post:
      operationId: createInventoryItem
      summary: Create one QuickBooks Inventory Item
      description: |
        Creates one Inventory Item using a unique name, ISO start date, decimal-safe quantity/cost/price, and
        freshly validated eligible Accounts, then verifies it by readback. Positive opening quantity and cost can
        change inventory value. The audited/idempotent sandbox write is not executable from Swagger UI.
      tags: [Inventory]
      parameters:
        - $ref: '#/components/parameters/ConnectionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      security:
        - railsSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInventoryItemRequest'
      responses:
        '200':
          $ref: '#/components/responses/ReplayedInventoryItem'
        '201':
          description: Inventory Item created and verified by QuickBooks readback.
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyNotReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryItemResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
  /api/v1/quickbooks/connections/{connection_id}/reports/general_ledger:
    get:
      operationId: getGeneralLedger
      summary: Get a QuickBooks General Ledger
      description: |
        Returns QuickBooks GeneralLedger rows for an inclusive period of at most six calendar months.
        QuickBooks calculates the read-only report; Rails preserves its rows and decimal values without
        recalculating or storing them.
      tags: [Financial Reports]
      parameters:
        - $ref: '#/components/parameters/ConnectionId'
        - $ref: '#/components/parameters/ReportStartDate'
        - $ref: '#/components/parameters/ReportEndDate'
        - $ref: '#/components/parameters/AccountingMethod'
      responses:
        '200':
          description: QuickBooks General Ledger report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialReportResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
  /api/v1/quickbooks/connections/{connection_id}/reports/trial_balance:
    get:
      operationId: getTrialBalance
      summary: Get a QuickBooks Trial Balance
      description: |
        Returns the read-only QuickBooks TrialBalance report for an inclusive period of at most six calendar
        months. Debit and credit values remain QuickBooks-provided decimal strings.
