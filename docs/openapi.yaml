      additionalProperties: false
      required: [journal_entry_operations, pagination, filters]
      properties:
        journal_entry_operations:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/JournalEntryOperation'
        pagination:
          $ref: '#/components/schemas/ReadPagination'
        filters:
          $ref: '#/components/schemas/TxnDateFilters'
    ReadPagination:
      type: object
      additionalProperties: false
      required: [page, per_page, returned_count, has_more, next_page]
      properties:
        page:
          type: integer
          minimum: 1
          maximum: 10000
        per_page:
          type: integer
          minimum: 1
          maximum: 50
        returned_count:
          type: integer
          minimum: 0
          maximum: 50
        has_more:
          type: boolean
        next_page:
          type: integer
          nullable: true
          minimum: 1
          maximum: 10000
    TxnDateFilters:
      type: object
      additionalProperties: false
      required: [txn_date_from, txn_date_to]
      properties:
        txn_date_from:
          type: string
          nullable: true
          format: date
        txn_date_to:
          type: string
          nullable: true
          format: date
    IdempotencyResult:
      type: object
      additionalProperties: false
      required: [replayed, operation_id]
      properties:
        replayed:
          type: boolean
          description: True when Rails returned the stored successful result without calling QuickBooks.
        operation_id:
          type: integer
          format: int64
          minimum: 1
          description: Local connection-scoped audit operation identifier.
    CreateJournalEntryRequest:
      type: object
      additionalProperties: false
      required: [journal_entry]
      properties:
        journal_entry:
          type: object
          additionalProperties: false
          required: [txn_date, memo, amount, debit_account_id, credit_account_id]
          properties:
            txn_date:
              type: string
              format: date
            memo:
              type: string
              minLength: 1
              maxLength: 500
            amount:
              type: string
              pattern: '^\d{1,12}(\.\d{1,2})?$'
              description: Positive decimal string with at most two decimal places.
              example: '100.00'
            debit_account_id:
              type: string
              pattern: '^\d{1,255}$'
            credit_account_id:
              type: string
              pattern: '^\d{1,255}$'
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
  responses:
    ReplayedEmployee:
